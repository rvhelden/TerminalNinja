<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XAML Playground — TerminalNinja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <style>
    /* ── shared tokens ──────────────────────────────────────── */
    :root {
      --bg-0: #070b12;
      --bg-1: #0d1420;
      --bg-2: #121b2b;
      --text: #d8e2f1;
      --muted: #95a7bf;
      --line: #2a3950;
      --accent: #3dd9b1;
      --accent-2: #49a7ff;
      --panel: rgba(14, 22, 34, 0.90);
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 5% 0%, #17325b 0%, transparent 60%),
        radial-gradient(800px 600px at 98% 5%, #1f2748 0%, transparent 60%),
        linear-gradient(160deg, var(--bg-0), var(--bg-1) 50%, var(--bg-2));
    }

    /* ── top bar ─────────────────────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      height: 46px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(6px);
      flex-shrink: 0;
    }

    .topbar a {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.85rem;
      transition: color 150ms ease;
    }
    .topbar a:hover { color: var(--accent); }

    .topbar-sep { color: var(--line); }

    .topbar-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text);
    }

    .topbar-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(61, 217, 177, 0.08);
      border: 1px solid rgba(61, 217, 177, 0.25);
      border-radius: 6px;
      padding: 2px 7px;
    }

    #status {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 300ms ease;
    }
    .status-dot.loading { background: var(--accent-2); animation: pulse 1s ease-in-out infinite; }
    .status-dot.ready   { background: var(--accent); }
    .status-dot.error   { background: #f87171; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── layout ──────────────────────────────────────────────── */
    .workspace {
      display: flex;
      height: calc(100vh - 46px);
      overflow: hidden;
    }

    /* ── panes ───────────────────────────────────────────────── */
    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-editor { flex: 1; border-right: 1px solid var(--line); }
    .pane-preview { flex: 1; }

    .pane-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: 38px;
      background: rgba(9, 15, 24, 0.8);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .pane-header-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .pane-header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
    }

    /* ── editor ──────────────────────────────────────────────── */
    #monaco-container {
      flex: 1;
      overflow: hidden;
    }

    /* ── controls ────────────────────────────────────────────── */
    .dim-input {
      background: rgba(10, 16, 26, 0.85);
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      padding: 3px 7px;
      width: 52px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      text-align: center;
    }
    .dim-input:focus { outline: none; border-color: var(--accent-2); }

    .dim-label {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-render {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #001018;
      border: none;
      border-radius: 8px;
      padding: 5px 14px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: transform 150ms ease, opacity 150ms ease;
    }
    .btn-render:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-render:disabled { opacity: 0.4; cursor: default; }

    /* ── xterm container ─────────────────────────────────────── */
    #xterm-container {
      flex: 1;
      padding: 8px;
      overflow: hidden;
      background: #0a0e17;
    }

    #xterm-container .xterm {
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="./index.html">← Docs</a>
    <span class="topbar-sep">/</span>
    <span class="topbar-title">XAML Playground</span>
    <span class="topbar-tag">WASM</span>
    <div id="status">
      <div class="status-dot loading" id="status-dot"></div>
      <span id="status-text">Loading runtime…</span>
    </div>
  </div>

  <div class="workspace">

    <!-- Editor pane -->
    <div class="pane pane-editor">
      <div class="pane-header">
        <span class="pane-header-label">XAML</span>
        <div class="pane-header-actions">
          <label class="dim-label">
            W <input class="dim-input" type="number" id="input-width" value="80" min="20" max="300">
          </label>
          <label class="dim-label">
            H <input class="dim-input" type="number" id="input-height" value="24" min="5" max="100">
          </label>
          <button class="btn-render" id="btn-render" disabled>Render</button>
        </div>
      </div>
      <div id="monaco-container"></div>
    </div>

    <!-- Preview pane -->
    <div class="pane pane-preview">
      <div class="pane-header">
        <span class="pane-header-label">Terminal Preview</span>
      </div>
      <div id="xterm-container"></div>
    </div>

  </div>

  <!-- xterm.js -->
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>

  <!-- Monaco editor AMD loader -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>

  <!-- Playground bootstrap (ES module) -->
  <script type="module" src="./playground.js"></script>

</body>
</html>
