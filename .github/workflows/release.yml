name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-release identifier (blank for stable, e.g. 'alpha', 'beta', 'rc')"
        required: false
        default: ""

permissions:
  contents: write      # push commit + tag created by Versionize
  id-token: write      # NuGet Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Versionize
        run: dotnet tool install --global Versionize

      - name: Bump version
        id: bump
        run: |
          PRE_FLAG=""
          if [ -n "${{ inputs.prerelease }}" ]; then
            PRE_FLAG="--pre-release ${{ inputs.prerelease }}"
          fi

          # --exit-insignificant-commits makes versionize exit 1 when nothing since the
          # last release warrants a bump. That's a legitimate no-op, not a failure — skip
          # the publish steps instead of failing the job. Any other exit 1 (dirty tree,
          # bad config, ...) must still fail, so match on the message as well as the code.
          set +e
          versionize --workingDir TerminalNinja --exit-insignificant-commits $PRE_FLAG 2>&1 | tee "$RUNNER_TEMP/versionize.log"
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -eq 0 ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ] && grep -q "Version was not affected by commits" "$RUNNER_TEMP/versionize.log"; then
            echo "::notice::No version-affecting commits since the last release — nothing to publish."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Push commit and tag
        if: steps.bump.outputs.bumped == 'true'
        run: git push --follow-tags

      - name: Login to NuGet (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: kiltux

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet run --project TerminalNinja.Tests/TerminalNinja.Tests.csproj -c Release

      - name: Pack
        run: dotnet pack TerminalNinja/TerminalNinja.csproj -c Release --no-build -o ./artifacts

      - name: Push to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
